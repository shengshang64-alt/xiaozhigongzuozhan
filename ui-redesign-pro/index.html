<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医疗售前工作台 · 核心页重构原型 v2</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E7C99'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E智%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>window.echarts||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"><\/script>')</script>
<style>
:root{
  /* 主色：青蓝 cyan-blue，专业克制 */
  --primary:#0E7C99;--primary-deep:#0A5D76;--primary-soft:#DDEEF3;--primary-tint:#EFF8FA;
  --primary-ring:rgba(14,124,153,.28);
  --accent:#E8973C;--accent-soft:#FCEFD9;--accent-deep:#B5742A;
  --danger:#D64545;--danger-soft:#FBE7E7;--danger-deep:#B23434;
  --success:#1F9D63;--success-soft:#E4F4EB;
  --info:#2E6FB0;--info-soft:#E7F0FA;--violet:#7B4FB0;--violet-soft:#F0EAF8;
  --bg:#EEF3F5;--surface:#fff;--surface-2:#F6F9FA;
  --ink:#122A31;--ink-2:#4A6169;--ink-3:#8CA1A8;
  --line:#E1E9EC;--line-2:#EDF2F4;
  --sidebar-bg:#0B2830;--sidebar-bg-2:#071C22;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:18px;
  --sh-1:0 1px 2px rgba(11,40,48,.05);--sh-2:0 2px 4px rgba(11,40,48,.05),0 6px 20px rgba(11,40,48,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
svg{display:block;flex-shrink:0}
.app{display:flex;min-height:100vh}
/* 侧边栏 */
.sidebar{width:224px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar-bg),var(--sidebar-bg-2));position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:50}
.side-logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.side-logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#22B8CE,var(--primary-deep));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(34,184,206,.35)}
.side-logo .name{color:#EAF4F2;font-size:15px;font-weight:700}
.side-logo .sub{color:#5C848C;font-size:9.5px;letter-spacing:1.8px;font-weight:600;margin-top:2px}
.side-nav{flex:1;overflow-y:auto;padding:8px 10px}
.side-group-label{padding:14px 12px 5px;font-size:10px;font-weight:600;letter-spacing:1.8px;color:#4C717A}
.side-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:8px;color:#9BB8BD;font-size:13.5px;transition:all .15s;position:relative;margin-bottom:1px}
.side-item:hover{background:rgba(255,255,255,.05);color:#DCEEEC}
.side-item.active{background:linear-gradient(90deg,rgba(34,184,206,.22),rgba(34,184,206,.06));color:#fff;font-weight:500}
.side-item.active::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#22B8CE;box-shadow:0 0 8px rgba(34,184,206,.6)}
.side-item svg{width:17px;height:17px;opacity:.85}
.side-item .lb{margin-left:auto;font-size:9px;padding:1px 5px;border-radius:5px;background:rgba(34,184,206,.25);color:#8FE6F2;font-weight:700;letter-spacing:.5px}
.side-footer{padding:12px;border-top:1px solid rgba(255,255,255,.05)}
.side-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(255,255,255,.04)}
.side-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#22B8CE,var(--primary-deep));color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.side-user .u-name{color:#E4F1EF;font-size:12.5px;font-weight:500}
.side-user .u-role{color:#5C848C;font-size:10.5px;margin-top:1px}
/* 主区 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:54px;flex-shrink:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:40}
.content{flex:1;padding:22px 24px;max-width:1560px;width:100%;margin:0 auto}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.crumb .sep{opacity:.5}.crumb .cur{color:var(--ink);font-weight:600}
.actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;width:250px;color:var(--ink-3);font-size:13px}
.search-box kbd{margin-left:auto;font-size:10.5px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.role-badge{display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-size:12.5px}
.role-badge b{font-weight:600}.role-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--success-soft);color:var(--success);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card-pad{padding:18px 20px}
.page-title{font-size:21px;font-weight:700;letter-spacing:-.3px}
.page-desc{color:var(--ink-2);font-size:13px;margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(14,124,153,.25)}
.btn-primary:hover{background:var(--primary-deep)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger-ghost{background:var(--danger-soft);border:1px solid rgba(214,69,69,.35);color:var(--danger-deep)}
.btn-sm{padding:5px 11px;font-size:12.5px}
.flex{display:flex;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap14{gap:14px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-5{margin-top:20px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-5{margin-bottom:20px}
.text-sm{font-size:12.5px}.text-xs{font-size:11.5px}
.tink2{color:var(--ink-2)}.tink3{color:var(--ink-3)}.tpri{color:var(--primary-deep)}
.fsem{font-weight:600}.fbold{font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag-primary{background:var(--primary-soft);color:var(--primary-deep)}
.tag-orange{background:var(--accent-soft);color:var(--accent-deep)}
.tag-blue{background:var(--info-soft);color:var(--info)}
.tag-red{background:var(--danger-soft);color:var(--danger-deep)}
.tag-green{background:var(--success-soft);color:var(--success)}
.tag-violet{background:var(--violet-soft);color:var(--violet)}
.tag-gray{background:var(--surface-2);color:var(--ink-2)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#22B8CE,var(--primary-deep));color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.view{display:none}.view.active{display:block;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.float-btn{position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(14,124,153,.4);z-index:60}
/* 通用工作区 */
.ws-toolbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 16px;margin-bottom:14px;box-shadow:var(--sh-1);flex-wrap:wrap}
.ws-toolbar .ws-title{font-size:15px;font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 14px;border-radius:6px;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--primary-deep);font-weight:600;box-shadow:var(--sh-1)}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-1)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.kpi-trend{font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px}
.kpi-val{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1}
.kpi-lbl{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.main-grid{display:grid;gap:14px;margin-bottom:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-title{font-size:15px;font-weight:600}
/* 流水线 */
.stepper{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px;margin-bottom:14px;box-shadow:var(--sh-1);overflow-x:auto}
.step{flex:1;display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;font-size:12.5px;color:var(--ink-3);cursor:pointer;min-width:126px;position:relative}
.step .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;background:#fff}
.step.done .n{background:var(--primary);border-color:var(--primary);color:#fff}
.step.done{color:var(--ink-2)}
.step.on{background:var(--primary-soft);color:var(--primary-deep);font-weight:600}
.step.on .n{border-color:var(--primary);color:var(--primary-deep)}
.step.risk .n{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.step.risk{color:var(--danger-deep)}
.step .sl{white-space:nowrap;line-height:1.25}
/* 三栏工作布局 */
.cols-work{display:grid;gap:14px;align-items:start}
.cols-work>.card{min-width:0;height:calc(100vh - 176px);display:flex;flex-direction:column;overflow:hidden}
.col-scroll{overflow-y:auto;flex:1}
/* 章节树（可拖拽） */
.tree-hint{font-size:11px;color:var(--ink-3);padding:0 10px 8px;display:flex;align-items:center;gap:5px}
.chap-list{padding:8px}
.chap{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:8px;font-size:13px;color:var(--ink-2);cursor:pointer;margin-bottom:3px;border:1px solid transparent;transition:background .12s,border-color .12s}
.chap:hover{background:var(--surface-2)}
.chap.on{background:var(--primary-soft);color:var(--primary-deep);font-weight:600;border-color:var(--primary-ring)}
.chap.drag-over{border-top:2px solid var(--primary)}
.chap.dragging{opacity:.4}
.chap .grip{color:var(--ink-3);opacity:.55;cursor:grab;width:13px;height:13px}
.chap .cno{font-size:11px;color:var(--ink-3);width:14px;text-align:right;flex-shrink:0}
.chap .cname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap .st{margin-left:auto;width:17px;height:17px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.st.done{background:var(--success);color:#fff}.st.gen{background:var(--accent);color:#fff}.st.todo{border:1.5px solid var(--line)}
/* 编辑器 */
.editor-area{overflow-y:auto;padding:26px 32px;background:#fff;flex:1}
.editor-area h2{font-size:20px;margin-bottom:4px}
.editor-area .doc-meta{font-size:12.5px;color:var(--ink-3);margin-bottom:18px}
.editor-area h3{font-size:16px;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.editor-area p{font-size:14px;color:var(--ink-2);line-height:1.85;margin-bottom:12px}
.ai-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding:10px;background:var(--primary-tint);border-radius:10px}
.ai-chip{font-size:12px;padding:5px 12px;border-radius:16px;background:#fff;border:1px solid var(--primary-soft);color:var(--primary-deep);display:flex;align-items:center;gap:4px}
.ai-chip:hover{border-color:var(--primary)}
/* 高亮块（编辑器内业务提示） */
.hl-miss{background:var(--accent-soft);border:1px solid rgba(232,151,60,.4);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--accent-deep);display:flex;gap:8px;align-items:flex-start}
.hl-risk{background:var(--danger-soft);border:1px solid rgba(214,69,69,.4);border-left:3px solid var(--danger);border-radius:0 8px 8px 0;padding:11px 14px;margin-bottom:14px;font-size:12.5px;color:var(--danger-deep);display:flex;gap:8px;align-items:flex-start}
.hl-done{background:var(--success-soft);border-left:3px solid var(--success);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#186B45}
.hl-tip{background:var(--primary-tint);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;padding:10px 14px;margin:14px 0;font-size:13px;color:var(--primary-deep)}
/* 双向映射锚点 */
.map-chip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:1px 7px;border-radius:8px;background:var(--info-soft);color:var(--info);font-weight:600;cursor:pointer;vertical-align:middle}
.map-chip:hover{background:var(--info);color:#fff}
.sow-para{position:relative;border-radius:8px;padding:2px 6px;margin-left:-6px;transition:background .3s}
.sow-para.flash{background:var(--primary-soft)}
.sow-para.weak{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
/* 右栏：素材弹药库 */
.mat-tab{display:flex;gap:4px;margin-bottom:12px}
.mat-tab button{flex:1;padding:7px;font-size:12.5px;border-radius:7px;color:var(--ink-2)}
.mat-tab button.on{background:var(--primary-soft);color:var(--primary-deep);font-weight:600}
.mat-search{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--ink-3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.mat-item{padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;font-size:12.5px}
.mat-item .mt{font-weight:600;font-size:12.5px;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.mat-item .mm{color:var(--ink-3);font-size:11.5px;line-height:1.5;margin-bottom:6px}
.mat-item .rel{margin-left:auto;font-size:10.5px;color:var(--primary-deep);background:var(--primary-tint);padding:1px 6px;border-radius:6px;font-weight:600}
.reco-bar{font-size:11.5px;color:var(--primary-deep);background:var(--primary-tint);border-radius:8px;padding:7px 10px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
/* 右栏：评分点清单 */
.sp-list{padding:10px}
.sp-sec{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.5px;padding:8px 6px 4px}
.sp-item{padding:10px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,background .12s}
.sp-item:hover{border-color:var(--primary-ring)}
.sp-item.active{border-color:var(--primary);background:var(--primary-tint)}
.sp-item.miss{border-left:3px solid var(--accent)}
.sp-item.risk{border-left:3px solid var(--danger)}
.sp-item.ok{border-left:3px solid var(--success)}
.sp-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sp-code{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:5px;padding:1px 6px}
.sp-score{margin-left:auto;font-size:11px;font-weight:700}
.sp-title{font-size:12.5px;font-weight:600;line-height:1.4;margin-bottom:4px}
.sp-meta{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
/* 空状态 */
.empty{text-align:center;padding:34px 20px;color:var(--ink-3)}
.empty svg{margin:0 auto 12px;opacity:.5}
.empty .et{font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.empty .ed{font-size:12px;line-height:1.6;max-width:280px;margin:0 auto 14px}
/* 情报三栏 */
.intel-filters{padding:12px}
.fg-label{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--ink-3);margin:14px 0 7px}
.fg-label:first-child{margin-top:2px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-size:12px;padding:4px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink-2);cursor:pointer}
.fchip.on{background:var(--primary-soft);color:var(--primary-deep);border-color:var(--primary-ring);font-weight:600}
.intel-card{padding:13px 15px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;margin-bottom:10px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.intel-card:hover{border-color:var(--primary-ring);box-shadow:var(--sh-1)}
.intel-card.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-ring)}
.intel-card .ic-title{font-size:14px;font-weight:600;line-height:1.5;margin:6px 0 5px}
.intel-card .ic-sum{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.intel-card .ic-meta{font-size:11.5px;color:var(--ink-3);margin-top:8px;display:flex;gap:12px;align-items:center}
.lead-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:8px;background:var(--violet-soft);color:var(--violet);font-weight:600}
/* 竞品 */
.csel{display:flex;gap:8px;flex-wrap:wrap}
.cchip{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:22px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13px;transition:all .12s}
.cchip .cdot{width:9px;height:9px;border-radius:50%}
.cchip.on{border-color:var(--primary);background:var(--primary-tint);color:var(--primary-deep);font-weight:600}
.cchip .ck{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9px}
.cchip.on .ck{background:var(--primary);border-color:var(--primary);color:#fff}
.chart-box{height:300px}
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th{text-align:center;padding:9px 6px;font-weight:600;color:var(--ink-2);border-bottom:2px solid var(--line);font-size:12px}
.matrix th:first-child{text-align:left}
.matrix td{padding:9px 6px;border-bottom:1px solid var(--line-2);text-align:center}
.matrix td:first-child{text-align:left;font-weight:600}
.matrix tr.best td:first-child{color:var(--primary-deep)}
.stars{letter-spacing:1px}.stars .off{color:var(--line)}
.talk-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.talk-card .tk-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.talk-card .tk-dim{font-size:12.5px;font-weight:600}
.talk-card .tk-b{font-size:12.5px;line-height:1.65;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:9px 11px;margin-top:6px}
.talk-card .copy-btn{margin-left:auto;font-size:11px;color:var(--primary-deep);background:var(--primary-tint);border-radius:6px;padding:3px 9px;display:flex;align-items:center;gap:3px}

let radarInst=null;
function whenEcharts(cb){if(window.echarts)return cb();var n=0;var t=setInterval(function(){if(window.echarts){clearInterval(t);cb()}else if(++n>120)clearInterval(t)},50)}
function initRadar(){const el=document.getElementById("radarChart");if(!el||!window.echarts)return;if(radarInst){radarInst.dispose();radarInst=null;}radarInst=echarts.init(el);const sel=COMP.filter(c=>c[2]);radarInst.setOption({tooltip:{},legend:{data:sel.map(c=>c[0]),bottom:0,textStyle:{fontSize:12}},radar:{indicator:[{name:"电子病历",max:5},{name:"集成平台",max:5},{name:"CDSS/AI",max:5},{name:"移动端",max:5},{name:"实施",max:5},{name:"价格",max:5}],radius:"62%",axisName:{color:"#4A6169",fontSize:12}},series:[{type:"radar",data:sel.map(c=>({value:c[3],name:c[0],itemStyle:{color:c[1]},areaStyle:{color:c[1]+"33"}}))}]});}
function wireSolutionDrag(){const tree=document.getElementById("solTree");if(!tree)return;let dragEl=null;tree.querySelectorAll(".chap").forEach(ch=>{ch.addEventListener("dragstart",()=>{dragEl=ch;ch.classList.add("dragging")});ch.addEventListener("dragend",()=>{ch.classList.remove("dragging");tree.querySelectorAll(".chap").forEach(c=>c.classList.remove("drag-over"));renumber(tree)});ch.addEventListener("dragover",e=>{e.preventDefault();if(!dragEl||dragEl===ch)return;const r=ch.getBoundingClientRect();const after=e.clientY>r.top+r.height/2;tree.insertBefore(dragEl,after?ch.nextSibling:ch);});});}
function renumber(tree){[...tree.querySelectorAll(".chap .cno")].forEach((n,i)=>n.textContent=i+1)}
function wireBidMap(){const ed=document.getElementById("bidEditor");if(!ed)return;document.querySelectorAll(".sp-item[data-para]").forEach(sp=>{sp.addEventListener("click",()=>{document.querySelectorAll(".sp-item").forEach(x=>x.classList.remove("active"));sp.classList.add("active");const t=document.getElementById(sp.dataset.para);if(t){t.scrollIntoView({behavior:"smooth",block:"center"});t.classList.add("flash");setTimeout(()=>t.classList.remove("flash"),1400);}});});ed.querySelectorAll(".map-chip[data-sp]").forEach(mc=>{mc.addEventListener("click",()=>{const t=document.getElementById(mc.dataset.sp);if(t){document.querySelectorAll(".sp-item").forEach(x=>x.classList.remove("active"));t.classList.add("active");t.scrollIntoView({behavior:"smooth",block:"center"});}});});}
function renderView(id){const c=document.getElementById("content");c.innerHTML=id==="comp"?compHTML():(V[id]||"");radarInst&&(id!=="comp"&&radarInst.dispose(),radarInst=null);if(id==="comp"){whenEcharts(initRadar);}if(id==="solution"){wireSolutionDrag();}if(id==="bid"){wireBidMap();}}

/* 全局事件委派 */
document.addEventListener("click",e=>{
  if(e.target.closest(".side-item")||e.target.closest(".icon-btn")||e.target.closest(".float-btn"))return;
  const cchip=e.target.closest(".cchip");
  if(cchip){const i=+cchip.dataset.ci;COMP[i][2]=COMP[i][2]?0:1;renderView("comp");return;}
  const grpSel=e.target.closest(".seg button,.mat-tab button,.fchip,.chat-tabs button");
  if(grpSel){grpSel.parentElement.querySelectorAll("button,.fchip").forEach(b=>b.classList.remove("on"));grpSel.classList.add("on");e.stopPropagation();return;}
  const ich=e.target.closest(".intel-card");
  if(ich){document.querySelectorAll(".intel-card").forEach(x=>x.classList.remove("on"));ich.classList.add("on");return;}
  const chap=e.target.closest(".chap");
  if(chap&&chap.closest(".chap-list")&&!e.target.closest("[draggable]")){/* 章节树点击选中 */chap.parentElement.querySelectorAll(".chap").forEach(x=>x.classList.remove("on"));chap.classList.add("on");return;}
  const copy=e.target.closest(".copy-btn,.talk-card .btn-primary");
  if(copy){const card=copy.closest(".talk-card");const txt=card?card.querySelector(".tk-b").textContent:"已复制全部话术";if(navigator.clipboard)navigator.clipboard.writeText(txt);toast("差异化话术已复制到剪贴板");return;}
  const b=e.target.closest("button");if(!b)return;const t=b.textContent.trim();if(!t||t.length>22)return;toast("「"+t+"」静态原型演示中");
});
let _th;function toast(m){let to=document.getElementById("__toast");if(!to){to=document.createElement("div");to.id="__toast";to.style.cssText="position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s";document.body.appendChild(to);}to.textContent=m;to.style.opacity="1";clearTimeout(_th);_th=setTimeout(()=>to.style.opacity="0",1600);}
nav("home");
</script>
</body>
</html>
