<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小智工作站 · 静态原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7490'/%3E%3Cpath d='M9 22V10l7 7 7-7v12' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --primary-50:#ECF8FA;--primary-100:#D2F0F5;--primary-200:#A6E0EA;--primary-300:#6CC8D8;
  --primary-400:#33A9C0;--primary-500:#158BA3;--primary-600:#0E7490;--primary-700:#0C5E75;
  --primary-800:#0E4E61;--primary-900:#104252;--primary-950:#042B38;
  --page:#F2F6F7;--subtle:#E9EFF1;--card:#FFFFFF;--border:#DCE5E8;--border-strong:#C5D2D7;
  --ink:#0F2A33;--text:#334B55;--muted:#647B85;--faint:#8BA0A9;
  --success:#1F9D6E;--success-bg:#E5F6EE;--warning:#C9832A;--warning-bg:#FBF0DD;
  --danger:#CF4747;--danger-bg:#FBEAEA;--info:#2E79B9;--info-bg:#E8F1F9;
  --purple:#7B5BB0;--purple-bg:#F0EBF7;
  --chart-1:#0E7490;--chart-2:#2E79B9;--chart-3:#7B5BB0;--chart-4:#C9832A;--chart-5:#1F9D6E;
  --sidebar:#0A242E;--sidebar-2:#0C2B37;--sidebar-text:#9DB9C3;--sidebar-active:#143D4C;
  --r-card:10px;--r-ctl:8px;--r-sm:6px;
  --sh-sm:0 1px 2px rgba(15,42,51,.05);--sh-card:0 1px 3px rgba(15,42,51,.06),0 1px 2px rgba(15,42,51,.04);
  --sh-pop:0 10px 28px rgba(15,42,51,.14);
  --font:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --sb-w:232px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--page);color:var(--text);font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
::selection{background:var(--primary-200)}a{color:var(--primary-600);text-decoration:none;cursor:pointer}
button{font-family:var(--font);cursor:pointer}ul{list-style:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c3d0d5;border-radius:100px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== 登录 ===== */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:linear-gradient(150deg,#0E4E61,#0A242E);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.login-art::before{content:"";position:absolute;right:-40px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(51,169,192,.25),transparent 70%)}
.login-art .lb{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.login-art .lb .lg{width:42px;height:42px;border-radius:11px;background:linear-gradient(145deg,var(--primary-400),var(--primary-600));display:flex;align-items:center;justify-content:center}
.login-art .lb b{font-size:18px}
.login-art h2{font-size:34px;font-weight:800;line-height:1.35;margin-bottom:18px;position:relative;z-index:2}
.login-art p{color:#9fc0cb;font-size:14px;position:relative;z-index:2;max-width:400px}
.login-art .lf{position:relative;z-index:2;color:#7fa0ab;font-size:12px}
.login-form{display:flex;align-items:center;justify-content:center;padding:48px}
.login-card{width:100%;max-width:360px}
.login-card h3{font-size:23px;color:var(--ink);font-weight:800;margin-bottom:6px}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:28px}

/* ===== 外壳布局 ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sb-w);background:linear-gradient(180deg,var(--sidebar-2),var(--sidebar));flex:none;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;overflow-y:auto;transition:transform .2s}
.sb-brand{display:flex;align-items:center;gap:11px;padding:14px 16px 12px;flex:none}
.sb-brand .lg{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--primary-400),var(--primary-600));display:flex;align-items:center;justify-content:center;flex:none}
.sb-brand b{font-size:15px;color:#fff;font-weight:700;line-height:1.2;display:block}
.sb-brand span{font-size:10.5px;color:#7fa0ab;letter-spacing:.5px}
.sb-nav{flex:none;padding:4px 12px 12px}
.sb-group{margin-top:10px}
.sb-group .gt{font-size:10.5px;color:#67828c;font-weight:700;padding:0 10px 6px;letter-spacing:1px}
.sb-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--sidebar-text);font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.13s;cursor:pointer}
.sb-item svg{width:17px;height:17px;flex:none;opacity:.85}
.sb-item:hover{background:rgba(255,255,255,.06);color:#dce9ee}
.sb-item.active{background:var(--sidebar-active);color:#fff;font-weight:700;box-shadow:inset 2px 0 0 var(--primary-400)}
.sb-item.active svg{opacity:1}
.sb-user{flex:none;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,var(--primary-400),var(--primary-700));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.sb-user .nm{font-size:13px;color:#e6eff2;font-weight:600;line-height:1.2}
.sb-user .rl{font-size:11px;color:#7fa0ab}

.main{flex:1;margin-left:var(--sb-w);display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:30}
.crumb{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:7px}
.crumb b{color:var(--ink);font-weight:700;font-size:13.5px}
.topbar .sp{flex:1}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--subtle);color:var(--ink)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid #fff}
.search-box{display:flex;align-items:center;gap:8px;background:var(--subtle);border:1px solid transparent;border-radius:var(--r-sm);padding:7px 12px;font-size:12.5px;color:var(--faint);min-width:200px}
.search-box:hover{border-color:var(--border-strong)}
.model-pill{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--primary-800);background:var(--primary-50);border:1px solid var(--primary-100);padding:6px 11px;border-radius:100px}
.content{padding:24px 26px 60px;flex:1}

/* ===== 通用组件 ===== */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
.page-head p{font-size:13px;color:var(--muted);margin-top:3px}
.page-head .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-ctl);font-size:13.5px;font-weight:600;border:1px solid transparent;background:none}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--primary-600);color:#fff}.btn-primary:hover{background:var(--primary-700)}
.btn-ghost{background:#fff;border-color:var(--border-strong);color:var(--text)}.btn-ghost:hover{background:var(--subtle)}
.btn-soft{background:var(--primary-50);color:var(--primary-700)}.btn-soft:hover{background:var(--primary-100)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-sm)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-h b{font-size:14.5px;color:var(--ink);font-weight:700}
.card-h .sp{flex:1}
.card-b{padding:18px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);padding:16px 18px;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.kpi .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.kpi .v{font-size:27px;font-weight:800;color:var(--ink);line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi .delta{font-size:11.5px;font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:100px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-info{background:var(--info-bg);color:var(--info)}.t-success{background:var(--success-bg);color:var(--success)}
.t-warning{background:var(--warning-bg);color:var(--warning)}.t-danger{background:var(--danger-bg);color:var(--danger)}
.t-purple{background:var(--purple-bg);color:var(--purple)}.t-muted{background:var(--subtle);color:var(--muted)}
.input,.select,textarea.input{width:100%;padding:9px 13px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);font-family:var(--font);font-size:13.5px;background:#fff;color:var(--ink);outline:none}
.input:focus,.select:focus{border-color:var(--primary-500);box-shadow:0 0 0 3px var(--primary-100)}
.field{margin-bottom:15px}.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.tabs{display:inline-flex;background:var(--subtle);border-radius:var(--r-ctl);padding:3px;gap:2px}
.tab{padding:7px 15px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;display:flex;align-items:center;gap:6px}
.tab.active{background:#fff;color:var(--primary-700);box-shadow:var(--sh-sm)}
.progress{height:7px;background:var(--subtle);border-radius:100px;overflow:hidden}
.progress > i{display:block;height:100%;border-radius:100px;background:linear-gradient(90deg,var(--primary-500),var(--primary-400))}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--subtle);text-align:left;padding:10px 14px;font-weight:700;color:var(--ink);font-size:12.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:hover td{background:var(--primary-50)}
.switch{width:38px;height:21px;border-radius:100px;background:var(--border-strong);position:relative;border:none;transition:.15s;flex:none}
.switch.on{background:var(--primary-600)}.switch::after{content:"";position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:var(--sh-sm)}
.switch.on::after{left:19px}
.alert{padding:12px 15px;border-radius:var(--r-ctl);font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.alert svg{flex:none;margin-top:1px}
.ic{width:16px;height:16px;flex:none}
.meta-line .ic{width:12.5px;height:12.5px}
.mini-actions .ic{width:13px;height:13px}
.tree-row .ic{width:13px;height:13px}
.col-h .ic{width:15px;height:15px}
.card-h .ic{width:15px;height:15px}
.icon-btn .ic{width:17px;height:17px}
.alert-info{background:var(--info-bg);color:#1f5b86}.alert-warn{background:var(--warning-bg);color:#8a5a17}
.alert-danger{background:var(--danger-bg);color:#9c3535}.alert-success{background:var(--success-bg);color:#17704f}

/* 三栏工作台 */
.three{display:grid;grid-template-columns:218px 1fr 320px;gap:16px;align-items:start;height:calc(100vh - 56px - 48px)}
.col{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-sm);min-height:0}
.col-h{padding:13px 16px;border-bottom:1px solid var(--border);font-weight:700;color:var(--ink);font-size:13.5px;display:flex;align-items:center;gap:8px}
.col-b{padding:14px;overflow-y:auto;flex:1}
.filter-block{margin-bottom:18px}.filter-block .ft{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.optrow{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;background:var(--subtle);color:var(--muted);border:1px solid transparent}
.opt.on{background:var(--primary-50);color:var(--primary-700);border-color:var(--primary-200)}
.list-card{border:1px solid var(--border);border-radius:var(--r-ctl);padding:12px 13px;margin-bottom:10px;transition:.13s}.list-card[onclick]{cursor:pointer}
.list-card:hover{border-color:var(--primary-300);box-shadow:var(--sh-sm)}
.list-card.on{border-color:var(--primary-500);background:var(--primary-50);box-shadow:inset 2px 0 0 var(--primary-600)}
.list-card h5{font-size:13.5px;color:var(--ink);font-weight:700;line-height:1.45;margin-bottom:7px}
.meta-line{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.mini-actions{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.mini-actions button{font-size:11.5px;padding:4px 9px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--muted);font-weight:600}
.mini-actions button:hover{border-color:var(--primary-400);color:var(--primary-700)}

/* 步骤条 */
.stepper{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:var(--r-card);padding:14px 18px;margin-bottom:18px;overflow-x:auto;box-shadow:var(--sh-sm)}
.step{display:flex;align-items:center;gap:9px;cursor:pointer;flex:none}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--subtle);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.step .nm{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.step.done .num{background:var(--success);color:#fff}
.step.active .num{background:var(--primary-600);color:#fff;box-shadow:0 0 0 4px var(--primary-100)}
.step.active .nm{color:var(--ink);font-weight:700}
.step-line{width:34px;height:2px;background:var(--border);margin:0 12px;flex:none}
.step-line.done{background:var(--success)}

/* 看板 */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{width:268px;flex:none;background:var(--subtle);border-radius:var(--r-card);padding:11px;min-height:200px}
.kcol-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink);padding:3px 4px 10px}
.kcol-h .cnt{margin-left:auto;background:#fff;border-radius:100px;padding:1px 8px;font-size:11.5px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--border);border-radius:var(--r-ctl);padding:11px 12px;margin-bottom:9px;box-shadow:var(--sh-sm);cursor:grab}
.kcard h6{font-size:13px;color:var(--ink);font-weight:700;margin-bottom:6px}
.kcard .amt{font-size:12px;font-weight:700;color:var(--primary-700)}

/* 大纲树 */
.tree-node{margin-bottom:2px}
.tree-row{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--r-sm);font-size:13px;color:var(--text);cursor:pointer}
.tree-row:hover{background:var(--subtle)}
.tree-row.on{background:var(--primary-50);color:var(--primary-800);font-weight:700}
.tree-row .caret{width:14px;color:var(--faint);flex:none}
.tree-row .tt{flex:1}
.tree-row .st{font-size:11px;color:var(--success);font-weight:700}
.tree-children{padding-left:18px;border-left:1px dashed var(--border);margin-left:15px}

/* 对话 */
.chat-layout{display:grid;grid-template-columns:240px 1fr;gap:16px;height:calc(100vh - 56px - 48px)}
.chat-list{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);padding:12px;overflow-y:auto;box-shadow:var(--sh-sm)}
.chat-main{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-sm)}
.chat-body{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:11px;max-width:80%}
.msg .bub{padding:11px 15px;border-radius:12px;font-size:13.5px;line-height:1.7}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.user .bub{background:var(--primary-600);color:#fff;border-top-right-radius:4px}
.msg.bot .bub{background:var(--subtle);color:var(--text);border-top-left-radius:4px}
.chat-input{border-top:1px solid var(--border);padding:14px 16px;display:flex;gap:10px}
.chat-input input{flex:1}
.session-item{padding:9px 11px;border-radius:var(--r-sm);font-size:12.5px;color:var(--text);cursor:pointer;margin-bottom:3px;line-height:1.4}
.session-item:hover{background:var(--subtle)}.session-item.on{background:var(--primary-50);color:var(--primary-800);font-weight:600}
.session-item .tm{font-size:11px;color:var(--faint);margin-top:2px}

/* toast & modal */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-ctl);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:99;box-shadow:var(--sh-pop)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-mask{position:fixed;inset:0;background:rgba(10,30,38,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px}
.modal{background:#fff;border-radius:var(--r-card);width:100%;max-width:520px;max-height:94vh;overflow-y:auto;box-shadow:var(--sh-pop)}
.modal-h{padding:17px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:800;color:var(--ink)}
.modal-b{padding:20px}.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.spacer{flex:1}.mt{margin-top:14px}.mb{margin-bottom:14px}.muted{color:var(--muted)}.faint{color:var(--faint)}
.center{display:flex;align-items:center;justify-content:center}.col-center{display:flex;flex-direction:column;align-items:center}
.empty{padding:44px 20px;text-align:center;color:var(--faint)}.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:12px}
.empty p{font-size:13px;margin-bottom:14px}
.doc-content{font-size:13.5px;line-height:1.85;color:var(--text)}
.doc-content p{margin-bottom:12px}.doc-content h4{color:var(--ink);margin:18px 0 9px;font-size:14.5px}
.badge-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.badge-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

@media(max-width:1100px){.three{grid-template-columns:200px 1fr}.three .col.detail{display:none}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){.sidebar{transform:translateX(-100%)}.main{margin-left:0}.three{grid-template-columns:1fr;height:auto}.g3,.g2{grid-template-columns:1fr}.chat-layout{grid-template-columns:1fr;height:auto}.login-wrap{grid-template-columns:1fr}.login-art{display:none}}

/* ===== 响应式 ===== */
.menu-btn{display:none}.sb-backdrop{display:none}
@media(max-width:920px){
  .menu-btn{display:flex}
  .sidebar{transform:translateX(-100%);box-shadow:var(--sh-pop)}
  .sidebar.open{transform:none}
  .sidebar.open ~ .sb-backdrop{display:block;position:fixed;inset:0;background:rgba(7,24,31,.46);z-index:39}
  .main{margin-left:0}
  .search-box,.model-pill{display:none}
  .topbar{padding:0 12px;gap:8px}
  .content{padding:16px 13px 50px}
  .three{grid-template-columns:1fr!important;height:auto;gap:14px}
  .three .col{overflow:visible;max-height:none}
  .three .col-b{overflow:visible;flex:none}
  .g4{grid-template-columns:repeat(2,1fr)}

/* 驾驶舱小部件 */
function funnel(rows){
  var max=rows[0][1];
  return rows.map(function(r){
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:11px">'+
      '<div style="width:62px;font-size:12px;color:var(--muted);flex:none">'+r[0]+'</div>'+
      '<div style="flex:1;background:var(--subtle);border-radius:5px;height:20px;position:relative;overflow:hidden"><div style="width:'+Math.round(r[1]/max*100)+'%;height:100%;background:'+r[2]+';border-radius:5px"></div></div>'+
      '<b style="width:18px;text-align:right;font-size:12.5px;color:var(--ink)">'+r[1]+'</b>'+
    '</div>';
  }).join('');
}
function donut(pct){
  var r=34,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<div style="position:relative;width:96px;height:96px"><svg width="96" height="96" viewBox="0 0 96 96">'+
    '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--subtle)" stroke-width="11"/>'+
    '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--success)" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 48 48)"/>'+
    '</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><b style="font-size:21px;color:var(--ink)">'+pct+'%</b><span style="font-size:10.5px;color:var(--faint)">中标率</span></div></div>';
}
function todoItem(done,text,meta,flag){
  return '<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)">'+
    '<div onclick="this.querySelector(\'svg\');toast(\'演示：标记完成\')" style="width:18px;height:18px;border-radius:5px;border:1.5px solid '+(done?'var(--success)':'var(--border-strong)')+';background:'+(done?'var(--success)':'#fff')+';flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff">'+(done?icon('check'):'')+'</div>'+

  '</div>';
}
function intelMini(tag,title,meta){
  var cls=tag==='政策'?'t-purple':'t-info';

    '<button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center" onclick="go(\'#/analytics\')">数据进入经营分析</button>'+
  '</div>';

  var body=head+'<div class="three" style="grid-template-columns:250px 1fr 280px"><div class="col">'+list+'</div><div class="col">'+factors+'</div><div class="col detail">'+ai+'</div></div>';
  return shell('#/reviews','复盘库',body);
};

/* ===== 售前经营分析 ===== */
views['#/analytics']=function(){
  var head='<div class="page-head"><div><h1>售前经营分析</h1><p>漏斗、趋势、人效与中标预测，管理者一屏看全盘</p></div><div class="spacer"></div><select class="select" style="width:130px"><option>本季度</option><option>本年度</option></select></div>';

  var kpi='<div class="grid g4 mb">'+
    '<div class="kpi"><div class="v">1.86 亿</div><div class="l">在跟商机金额</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--primary-700)">4,200 万</div><div class="l">季度加权中标预测</div></div>'+
    '<div class="kpi"><div class="v">68%</div><div class="l">中标率（滚动 12 月）</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--success)">+12%</div><div class="l">人均商机金额同比</div></div></div>';

  var funnel2='<div class="card"><div class="card-h"><b>商机金额漏斗（万元）</b></div><div class="card-b">'+
    funnel([['线索',9800,'var(--chart-2)'],['联系',6200,'var(--chart-2)'],['需求',4600,'var(--primary-500)'],['方案',3200,'var(--primary-600)'],['投标',2500,'var(--primary-700)']])+
    '<h4 style="font-size:13px;margin:14px 0 7px">阶段转化率</h4><table class="tbl"><tbody>'+
      '<tr><td>线索→联系</td><td style="text-align:right">67%</td></tr><tr><td>需求→方案</td><td style="text-align:right">67%</td></tr><tr><td>投标→中标</td><td style="text-align:right"><b>68%</b></td></tr>'+
    '</tbody></table></div></div>';

  var trend='<div class="card mb"><div class="card-h"><b>新增商机 / 中标金额走势</b></div><div class="card-b">'+
    trendBars()+'</div></div>'+
    '<div class="card"><div class="card-h"><b>中标贡献排名</b></div><div class="card-b" style="padding:8px 14px 14px"><table class="tbl"><thead><tr><th>成员</th><th>中标金额</th><th>中标率</th></tr></thead><tbody>'+
      '<tr><td>张工</td><td>2,180 万</td><td><span class="tag t-success">72%</span></td></tr>'+
      '<tr><td>李工</td><td>1,560 万</td><td><span class="tag t-success">66%</span></td></tr>'+
      '<tr><td>王工</td><td>980 万</td><td><span class="tag t-warning">58%</span></td></tr>'+
    '</tbody></table></div></div>';

  var body=head+kpi+'<div class="grid g2" style="align-items:start">'+funnel2+trend+'</div>';
  return shell('#/analytics','售前经营分析',body);
};
function trendBars(){
  var months=[['4',42,18],['5',55,26],['6',48,22],['7',68,34],['8',72,30],['9',86,42]];
  var max=90;
  return '<div style="display:flex;gap:14px;align-items:flex-end;height:150px;padding:0 6px">'+months.map(function(m2){
    return '<div style="flex:1;display:flex;gap:4px;align-items:flex-end;height:100%"><div title="商机" style="flex:1;height:'+Math.round(m2[1]/max*100)+'%;background:var(--primary-500);border-radius:4px 4px 0 0"></div><div title="中标" style="flex:1;height:'+Math.round(m2[2]/max*100)+'%;background:var(--chart-2);border-radius:4px 4px 0 0"></div></div><div style="position:absolute"></div>';
  }).join('')+'</div><div style="display:flex;gap:14px;padding:6px 6px 0"><div style="flex:1;text-align:center;font-size:11px;color:var(--faint)">4月</div><div style="flex:1;text-align:center;font-size:11px;color:var(--faint)">5月</div><div style="flex:1;text-align:center;font-size:11px;color:var(--faint)">6月</div><div style="flex:1;text-align:center;font-size:11px;color:var(--faint)">7月</div><div style="flex:1;text-align:center;font-size:11px;color:var(--faint)">8月</div><div style="flex:1;text-align:center;font-size:11px;color:var(--faint)">9月</div></div>'+
    '<div class="meta-line mt" style="font-size:11.5px"><span class="tag t-primary">商机</span><span class="tag t-info">中标</span>整体上行，9 月为年内高点。</div>';
}

function render(){
  var h=location.hash||'#/';
  var key=h.split('?')[0];
  var fn=views[key]||views['#/'];
  document.getElementById('app').innerHTML=fn();
  var _sb=document.querySelector('.sidebar');if(_sb)_sb.classList.remove('open');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
if(!location.hash) location.hash='#/';
